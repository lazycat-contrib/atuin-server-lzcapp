version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-output/atuin.lpk
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: atuin
build:
  run_buildscript: false
images:
  - id: atuin
    target: service
    service: atuin
    source: ghcr.io/atuinsh/atuin
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Atuin
    summary: 同步、搜索和备份 Shell 历史记录的 Atuin 服务端

