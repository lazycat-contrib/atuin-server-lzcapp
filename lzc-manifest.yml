application:
  subdomain: atuin
  entries:
    - id: main
      title: "Help"
      path: /help
  upstreams:
    - location: /help
      backend: file:///lzcapp/pkg/content/web/index.html
    - location: /
      backend: http://atuin:8888/
  public_path:
    - /

services:
  atuin:
    # ghcr.io/atuinsh/atuin:18.16.1
    image: registry.lazycat.cloud/czyt/atuinsh/atuin:b04cbf4ce000d321
    user: root
    command: start
    environment:
      - ATUIN_HOST=0.0.0.0
      - ATUIN_PORT=8888
      - ATUIN_OPEN_REGISTRATION={{.U.open_registration}}
      - ATUIN_DB_URI={{.U.db_uri}}
      - RUST_LOG=info,atuin_server=debug
    binds:
      - /lzcapp/var/config:/config

    usage: |
      Atuin Shell 历史服务器

      打开应用查看使用说明。
      服务器地址会自动从浏览器检测。

      注意：您可能需要刷新/重新打开页面才能跳转到帮助页面。
